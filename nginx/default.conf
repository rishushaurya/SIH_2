# TLS termination for the MahaLink gateway (docker compose --profile tls up -d).
# Security headers are set by the gateway itself (helmet); nginx only adds transport security.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;

    location / {
        proxy_pass http://mahalink:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Server-Sent Events (Live Inspection Console) must not be buffered
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
